# Render Blueprint for the TechFest 2026 API (optional: you can also fill the same values in
# the Render dashboard by hand - see DEPLOYMENT.md, step 13).
services:
  - type: web
    name: techfest-2026-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    # Only redeploy once the GitHub Actions CI run for the commit is green.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste the Atlas connection string in the dashboard; never commit it
      - key: JWT_SECRET
        generateValue: true # Render generates a random 256-bit secret
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://techfest2026.netlify.app (no trailing slash)
